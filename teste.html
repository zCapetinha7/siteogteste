<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equipe Original Gifs</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-image: url('assets/banneroriginal');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      position: relative;
    }

    body::after {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      z-index: -1;
    }

    .container {
      padding: 50px;
      color: white;
    }

    h2 {
      font-size: 28px;
      margin-bottom: 20px;
    }

    .section {
      margin-bottom: 60px;
    }

    .profiles {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }

    .profile-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 15px;
      width: 250px;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .profile-card:hover {
      transform: scale(1.05);
    }

    .profile-avatar {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .profile-info {
      text-align: center;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.8);
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      background: #1a1a1a;
      padding: 30px;
      border-radius: 12px;
      max-width: 500px;
      width: 90%;
      color: white;
      position: relative;
    }

    .modal-avatar {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 50%;
      margin-bottom: 20px;
    }

    .close-modal {
      position: absolute;
      top: 15px;
      right: 15px;
      background: transparent;
      border: none;
      color: white;
      font-size: 24px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="section">
      <h2>Fundadores</h2>
      <div id="fundadores" class="profiles"></div>
    </div>

    <div class="section">
      <h2>Co-Fundadores</h2>
      <div id="cofundadores" class="profiles"></div>
    </div>

    <div class="section">
      <h2>Desenvolvedores</h2>
      <div id="desenvolvedores" class="profiles"></div>
    </div>
  </div>

  <!-- MODAL -->
  <div class="modal" id="user-modal">
    <div class="modal-content">
      <button class="close-modal" onclick="closeModal()">&times;</button>
      <img id="modal-avatar" class="modal-avatar">
      <h2 id="modal-name"></h2>
      <p><strong>Cargo:</strong> <span id="modal-role"></span></p>
      <p><strong>Entrou em:</strong> <span id="modal-entry"></span></p>
      <div style="margin-top: 20px; text-align: left;">
        <strong>Sobre mim:</strong>
        <p id="modal-bio" style="margin-top: 5px;"></p>
      </div>
    </div>
  </div>

  <script>
    const perfis = {
      fundadores: [
        { id: '701558357286191204', nome: 'Hyxam', cargo: 'Fundador', entrada: '01/01/2023', bio: 'Hyxam é um dos fundadores do servidor, conhecido por sua liderança excêntrica.' },
        { id: '358074964533837825', nome: 'Kontra', cargo: 'Fundador', entrada: '01/01/2023', bio: 'Kontra é o fundador mais ativo, mesmo quando parece inativo.' }
      ],
      cofundadores: [
        { id: '1134639635780350142', nome: 'Seven', cargo: 'Co-Fundador', entrada: '01/02/2023', bio: 'Seven administra a parte financeira e é viciado em Roblox.' }
      ],
      desenvolvedores: [
        { id: '1080175803024814142', nome: 'DarkMode', cargo: 'Dev', entrada: '15/03/2023', bio: 'Criador do CMSP Hacks, conhecido pelo uso intensivo de IA.' }
      ]
    };

    async function buscarAvatar(id) {
      try {
        const res = await fetch(`https://discord-lookup-api-sandy.vercel.app/v1/user/${id}`);
        const data = await res.json();
        return data.avatar?.link + '.png?size=2048' || 'https://i.imgur.com/wubcMzk.jpeg';
      } catch {
        return 'https://i.imgur.com/wubcMzk.jpeg';
      }
    }

    async function criarPerfil(user, containerId) {
      const container = document.getElementById(containerId);
      const card = document.createElement('div');
      card.className = 'profile-card';

      const avatar = document.createElement('img');
      avatar.className = 'profile-avatar';
      avatar.src = await buscarAvatar(user.id);
      card.appendChild(avatar);

      const info = document.createElement('div');
      info.className = 'profile-info';
      info.innerHTML = `<h3>${user.nome}</h3><span>${user.cargo}</span><p>${user.entrada}</p>`;
      card.appendChild(info);

      card.onclick = () => abrirModal(user, avatar.src);
      container.appendChild(card);
    }

    function abrirModal(user, avatarUrl) {
      document.getElementById('modal-avatar').src = avatarUrl;
      document.getElementById('modal-name').textContent = user.nome;
      document.getElementById('modal-role').textContent = user.cargo;
      document.getElementById('modal-entry').textContent = user.entrada;
      document.getElementById('modal-bio').textContent = user.bio;
      document.getElementById('user-modal').classList.add('show');
    }

    function closeModal() {
      document.getElementById('user-modal').classList.remove('show');
    }

    window.onload = () => {
      perfis.fundadores.forEach(p => criarPerfil(p, 'fundadores'));
      perfis.cofundadores.forEach(p => criarPerfil(p, 'cofundadores'));
      perfis.desenvolvedores.forEach(p => criarPerfil(p, 'desenvolvedores'));
    };
  </script>
</body>
</html>
