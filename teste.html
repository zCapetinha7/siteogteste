<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equipe Original Gifs</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #2c003e, #1a001f);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 80px;
      position: relative;
      overflow: hidden;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 50px;
      position: fixed;
      top: 0;
      width: 100%;
      background-color: #1a001f;
      z-index: 1000;
    }

    .logo {
      font-size: 1.8em;
      color: #b86bff;
      font-weight: bold;
    }

    .nav-links {
      list-style: none;
      display: flex;
      gap: 15px;
    }

    .nav-links li a {
      text-decoration: none;
      color: #fff;
      font-size: 1em;
      padding: 10px 15px;
      border-radius: 8px;
      background-color: rgba(255, 255, 255, 0.1);
      transition: 0.3s;
    }

    .nav-links li a:hover {
      background-color: rgba(255, 255, 255, 0.2);
      color: #b86bff;
    }

    .section-title {
      font-size: 2rem;
      font-weight: bold;
      color: #b86bff;
      margin: 40px 0 20px;
    }

    .staff-container {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      justify-content: center;
      width: 100%;
      max-width: 1200px;
    }

    .profile-card {
      background: #1e1e1e;
      border-radius: 10px;
      overflow: hidden;
      width: 200px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      cursor: pointer;
      transition: 0.3s;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 0.6s ease forwards;
    }

    .profile-card:hover {
      transform: scale(1.05);
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .profile-banner {
      width: 100%;
      height: 100px;
      object-fit: cover;
    }

    .profile-avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      margin-top: -45px;
      border: 3px solid #1a001f;
      object-fit: cover;
    }

    .profile-info {
      padding: 10px;
    }

    .profile-info h3 {
      margin: 10px 0 5px;
      font-size: 1.1rem;
    }

    .profile-info span,
    .profile-info p {
      font-size: 0.9rem;
      color: #bbb;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
      z-index: 2000;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      background: #121212;
      padding: 30px;
      border-radius: 15px;
      max-width: 500px;
      color: #fff;
      text-align: center;
    }

    .modal-avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      margin-bottom: 15px;
    }

    .close-modal {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 1.5rem;
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
    }

    /* Container para Fundadores e Co-Fundadores */
    .fundadores-cofundadores-container {
      display: flex;
      gap: 50px;
      justify-content: center;
      width: 100%;
      margin-bottom: 50px;
    }

    .fundadores-container,
    .cofundadores-container {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      justify-content: center;
      width: 48%;
    }

    /* Container para Desenvolvedores */
    .desenvolvedores-container {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      justify-content: center;
      width: 100%;
    }

    /* Animação das estrelas */
    .star {
      position: absolute;
      border-radius: 50%;
      background-color: #fff;
      opacity: 0.6;
      animation: twinkle 1.5s infinite alternate;
    }

    @keyframes twinkle {
      0% {
        transform: scale(1) translateY(0);
        opacity: 0.6;
      }
      50% {
        opacity: 1;
      }
      100% {
        transform: scale(1.5) translateY(20px);
        opacity: 0.6;
      }
    }

    .star:nth-child(odd) {
      animation-duration: 2s;
    }

  </style>
</head>
<body>
  <div class="stars"></div>

  <nav class="navbar">
    <div class="logo">ORIGINAL</div>
    <ul class="nav-links">
      <li><a href="index.html">Início</a></li>
      <li><a href="#" class="active">Membros</a></li>
      <li><a href="#">Comandos</a></li>
      <li><a href="#">Diretrizes</a></li>
    </ul>
  </nav>

  <div class="section-title">Fundadores e Co-Fundadores</div>
  <div class="fundadores-cofundadores-container">
    <div class="fundadores-container" id="fundadores"></div>
    <div class="cofundadores-container" id="cofundadores"></div>
  </div>

  <div class="section-title">Desenvolvedores</div>
  <div class="desenvolvedores-container" id="desenvolvedores"></div>

  <div class="modal" id="user-modal">
    <div class="modal-content">
      <button class="close-modal" onclick="closeModal()">&times;</button>
      <img id="modal-avatar" class="modal-avatar">
      <h2 id="modal-name"></h2>
      <p id="modal-bio"></p>
    </div>
  </div>

  <script>
    // Função para criar as estrelas
    function createStars(num) {
      const container = document.querySelector('.stars');
      for (let i = 0; i < num; i++) {
        const star = document.createElement('div');
        star.classList.add('star');
        star.style.width = `${Math.random() * 3 + 1}px`;
        star.style.height = star.style.width;
        star.style.top = `${Math.random() * 100}%`;
        star.style.left = `${Math.random() * 100}%`;
        container.appendChild(star);
      }
    }

    // Cria as estrelas quando a página carrega
    window.onload = () => {
      createStars(200);
    }

    const perfis = {
      fundadores: [
        { id: '701558357286191204', nome: 'Hyxam', cargo: 'Fundador', banner: 'https://via.placeholder.com/200x100', entrada: '01/01/2023', bio: 'Hyxam é um dos fundadores do servidor, conhecido por sua liderança excêntrica.' },
        { id: '358074964533837825', nome: 'Kontra', cargo: 'Fundador', banner: 'https://via.placeholder.com/200x100', entrada: '01/01/2023', bio: 'Kontra é o fundador mais ativo, mesmo quando parece inativo.' },
      ],
      cofundadores: [
        { id: '1134639635780350142', nome: 'Seven', cargo: 'Co-Fundador', banner: 'https://via.placeholder.com/200x100', entrada: '01/02/2023', bio: 'Seven administra a parte financeira e é viciado em Roblox.' }
      ],
      desenvolvedores: [
        { id: '1080175803024814142', nome: 'DarkMode', cargo: 'Dev', banner: 'https://via.placeholder.com/200x100', entrada: '15/03/2023', bio: 'Criador do CMSP Hacks, conhecido pelo uso intensivo de IA.' }
      ]
    };

    async function buscarAvatar(id) {
      try {
        const res = await fetch(`https://discord-lookup-api-sandy.vercel.app/v1/user/${id}`);
        const data = await res.json();
        return data.avatar?.link + '.png?size=2048' || 'https://i.imgur.com/wubcMzk.jpeg';
      } catch (e) {
        return 'https://i.imgur.com/wubcMzk.jpeg';
      }
    }

    async function criarPerfil(user, containerId) {
      const container = document.getElementById(containerId);
      const card = document.createElement('div');
      card.className = 'profile-card';

      const banner = document.createElement('img');
      banner.className = 'profile-banner';
      banner.src = user.banner;
      card.appendChild(banner);

      const avatar = document.createElement('img');
      avatar.className = 'profile-avatar';
      avatar.src = await buscarAvatar(user.id);
      card.appendChild(avatar);

      const info = document.createElement('div');
      info.className = 'profile-info';
      info.innerHTML = `<h3>${user.nome}</h3><span>${user.cargo}</span><p>${user.entrada}</p>`;
      card.appendChild(info);

      card.onclick = () => abrirModal(user, avatar.src);
      container.appendChild(card);
    }

    function abrirModal(user, avatarUrl) {
      document.getElementById('modal-avatar').src = avatarUrl;
      document.getElementById('modal-name').textContent = `${user.nome} - ${user.cargo}`;
      document.getElementById('modal-bio').textContent = user.bio;
      document.getElementById('user-modal').classList.add('show');
    }

    function closeModal() {
      document.getElementById('user-modal').classList.remove('show');
    }

    window.onload = () => {
      for (const fundador of perfis.fundadores) criarPerfil(fundador, 'fundadores');
      for (const cofundador of perfis.cofundadores) criarPerfil(cofundador, 'cofundadores');
      for (const dev of perfis.desenvolvedores) criarPerfil(dev, 'desenvolvedores');
    }
  </script>
</body>
</html>
